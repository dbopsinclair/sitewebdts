name: Apply Elite Core patch

on:
  push:
    branches:
      - feature/elite-core-mvp
    paths:
      - '.elite-core-patch/APPLY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and apply patch
        run: |
          cat .elite-core-patch/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/elite-core-patch.zip
          unzip -o /tmp/elite-core-patch.zip -d .
          rm -rf .elite-core-patch
          rm -f .github/workflows/apply-elite-core-patch.yml
      - name: Commit generated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(core): implement Elite Core MVP [elite-core-bootstrap]"
          git push origin HEAD:${GITHUB_REF_NAME}
